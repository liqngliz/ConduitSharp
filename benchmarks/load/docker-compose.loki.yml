services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector.yaml"]
    volumes:
      # Defaults to the OTLP-receiver config, so every existing arm is unchanged. The filelog arm
      # sets OTEL_CONF=otel-collector-filelog to tail the capture file instead of receiving pushes.
      - ./observability/${OTEL_CONF:-otel-collector}.yaml:/etc/otel-collector.yaml
      # Read-only view of the capture file the gateway appends to (filelog arm only; harmless
      # otherwise). Same named volume the gateway and promtail already share.
      - envoy-logs:/tmp/envoy-logs:ro
      - capture-disk:/var/log/conduit:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    depends_on:
      - tempo
      - loki

  tempo:
    image: grafana/tempo:latest
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./observability/tempo.yaml:/etc/tempo.yaml

  loki:
    image: grafana/loki:latest
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./observability/loki.yaml:/etc/loki/loki.yaml
    ports:
      - "3100:3100"

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - tempo
      - loki

  promtail:
    image: grafana/promtail:latest
    volumes:
      - ./observability/promtail.yaml:/etc/promtail/promtail.yaml
      - envoy-logs:/tmp/envoy-logs
    command: -config.file=/etc/promtail/promtail.yaml
    depends_on:
      - loki
