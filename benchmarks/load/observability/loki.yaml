auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  # Loki's default gRPC receive cap is 4 MiB, and the OTLP path pushes whole batches of captured
  # request bodies through it. An oversized push is rejected with 503 ResourceExhausted and retried
  # unchanged forever, so the s6 OTLP arms silently reported ~3% ingestion. The collector now caps
  # records per batch; this raises the ceiling so a burst of larger bodies degrades instead of
  # deadlocking. Both sides are needed: the cap bounds the common case, this bounds the tail.
  grpc_server_max_recv_msg_size: 16777216
  grpc_server_max_send_msg_size: 16777216

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  allow_structured_metadata: true
  volume_enabled: true
  ingestion_rate_mb: 500
  ingestion_burst_size_mb: 1000
  per_stream_rate_limit: 5000MB
  per_stream_rate_limit_burst: 5000MB
