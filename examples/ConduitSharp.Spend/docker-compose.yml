# Optional convenience for anyone who prefers compose to `docker run`. Needs no clone: the image
# is pulled, not built. To build from a checkout instead, use docker-compose.dev.yml.
services:
  token-flow:
    image: ghcr.io/liqngliz/token-flow:latest
    restart: unless-stopped
    ports:
      - "4000:4000"
    volumes:
      - ./logs:/data
      # Your own routes, pulled out of the image and edited. See the README.
      # - ./routes.json:/app/Configuration/routes.json:ro
    # Linux only: Docker Desktop provides this name already.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
