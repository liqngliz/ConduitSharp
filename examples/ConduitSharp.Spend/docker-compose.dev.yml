# Local development: builds the image from this checkout instead of pulling from GHCR.
#
#   docker compose -f docker-compose.dev.yml up --build
#
# Configuration/ is mounted over the baked-in copy, so editing routes.json or appsettings.json
# takes effect on `docker compose -f docker-compose.dev.yml restart` with no rebuild. Code
# changes still need --build.
#
# Its own project name, so it never recreates the container docker-compose.yml owns.
name: tokenflow-dev

services:
  tokenflow:
    build:
      context: ../..
      dockerfile: examples/ConduitSharp.Spend/Dockerfile
    image: tokenflow:dev
    container_name: tokenflow-dev
    ports:
      - "5050:5050"
    volumes:
      - ./logs:/data
      - ./Configuration:/app/Configuration:ro
    # Linux only: Docker Desktop provides this name already.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
